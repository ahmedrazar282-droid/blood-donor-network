{% extends "base.html" %}
{% block title %}Log in | Sindh Blood Donor Network{% endblock %}
{% block main_class %}page auth{% endblock %}
{% block content %}
<div class="card overflow-hidden"><div class="row g-0">
  <div class="col-md-5 auth-side d-none d-md-flex">
    <div><h2>Welcome back</h2><p>Log in to post a request, respond to donors, or update your availability.</p></div>
  </div>
  <div class="col-md-7 p-4 p-lg-5">
    <h2 class="h4 mb-3">Log in</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Email</label><input class="form-control" type="email" name="email" required>
      <label class="form-label mt-3">Password</label><input class="form-control" type="password" name="password" required>
      <button class="btn btn-brand w-100 mt-4">Log in</button>
    </form>
    <p class="small text-muted mt-3 mb-0">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
  </div>
</div></div>
{% endblock %}
