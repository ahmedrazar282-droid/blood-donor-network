{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 420px;"><div class="card-body">
  <h4>Log in</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label mt-2">Email</label><input class="form-control" type="email" name="email" required>
    <label class="form-label mt-2">Password</label><input class="form-control" type="password" name="password" required>
    <button class="btn btn-brand w-100 mt-3">Log in</button>
  </form>
  <p class="small text-muted mt-3 mb-0">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</div></div>
{% endblock %}
